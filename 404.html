<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | WorldQuiz Store</title>
    <style>
      :root {
        --bg: #140d07;
        --text: #fff3ea;
        --muted: #d4b19b;
        --primary: #ff8a3d;
        --line: #5f3a26;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
        background: radial-gradient(circle at 20% 0%, #3a2315 0%, var(--bg) 48%);
        color: var(--text);
      }

      .card {
        width: min(560px, 92%);
        padding: 36px 26px;
        border-radius: 16px;
        text-align: center;
        border: 1px solid var(--line);
        background: linear-gradient(170deg, rgba(18, 29, 51, 0.95), rgba(12, 20, 36, 0.95));
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.33);
      }

      .badge {
        display: inline-block;
        margin-bottom: 10px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        border: 1px solid rgba(255, 138, 61, 0.45);
        background: rgba(255, 138, 61, 0.14);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 8vw, 4.2rem);
        line-height: 1;
      }

      p {
        margin: 14px 0 0;
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 22px;
        padding: 10px 16px;
        border-radius: 10px;
        text-decoration: none;
        color: #fff;
        background: var(--primary);
        font-weight: 600;
        transition: background 0.2s ease;
      }

      a:hover {
        background: #e56f23;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">WorldQuiz Store</span>
      <h1>404</h1>
      <p>The page you are looking for does not exist or has been moved to a new location.</p>
      <a href="/">Back to Home</a>
    </main>
  </body>
</html>
